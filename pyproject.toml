[project]
name = "q"
version = "0.1.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faker>=37.12.0",
    "more-itertools>=10.8.0",
    "pydantic-ai>=1.9.0",
    "pydantic-ai-slim[duckduckgo,tavily]>=1.9.0",
    "python-dotenv>=1.2.1",
    "rich>=14.2.0",
    "toml>=0.10.2",
]

[dependency-groups]
dev = [
    "mcp-run-python>=0.0.21",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-mock>=3.15.1",
]

[tool.ruff]
line-length = 120

[project.scripts]
q = "q.cli:main"
